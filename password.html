{% extends "base.html" %}
{% block content %}
<h3>Change password</h3>
<form method="post" class="card card-body" style="max-width:480px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-2"><label class="form-label">Current password</label><input type="password" class="form-control" name="old" required></div>
  <div class="mb-2"><label class="form-label">New password (min 8 characters)</label><input type="password" class="form-control" name="new" required></div>
  <div class="mb-3"><label class="form-label">Repeat new password</label><input type="password" class="form-control" name="new2" required></div>
  <button class="btn btn-primary">Change password</button>
</form>
{% endblock %}
