{% extends "base.html" %}{% from "_macros.html" import table %}
{% block content %}
<h3>{{ m.title }}</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-2">
    {% for f in fields %}
    <div class="col-md-3">
      <label class="form-label">{{ f.label }}{% if f.req %} *{% endif %}</label>
      {% if f.kind == 'select' %}
        <select class="form-select" name="{{ f.col }}" {% if f.req %}required{% endif %}>
          <option value="">-- select --</option>
          {% for o in f.options %}<option value="{{ o[0] }}">{{ o[1] }}</option>{% endfor %}
        </select>
      {% else %}
        <input class="form-control" name="{{ f.col }}" {% if f.req %}required{% endif %}>
      {% endif %}
    </div>
    {% endfor %}
    <div class="col-md-12"><button class="btn btn-primary mt-2">Save</button></div>
  </div>
</form>
{{ table(rows) }}
{% endblock %}
