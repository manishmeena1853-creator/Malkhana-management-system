{% extends "base.html" %}{% from "_macros.html" import table, select %}
{% block content %}
<h3>Court Orders</h3>
<p class="text-muted">A court order is required before property can be released to the owner or disposed.</p>
<form method="post" class="card card-body mb-4">
  <div class="row g-2">
    <div class="col-md-3"><label class="form-label">Court *</label>{{ select('court_id', courts) }}</div>
    <div class="col-md-3"><label class="form-label">Order no *</label><input class="form-control" name="order_no" required></div>
    <div class="col-md-2"><label class="form-label">Order date *</label><input type="date" class="form-control" name="order_date" required></div>
    <div class="col-md-3"><label class="form-label">Type *</label>
      <select class="form-select" name="type" required>{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Property covered (same case; Ctrl+click for many) *</label>
      <select class="form-select" name="property_ids" multiple size="5" required>
        {% for p in props %}<option value="{{ p.v }}">{{ p.l }}</option>{% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label">Details</label><textarea class="form-control" name="details" rows="4"></textarea></div>
    <div class="col-12"><button class="btn btn-primary mt-2">Save order</button></div>
  </div>
</form>
{{ table(rows) }}
{% endblock %}
