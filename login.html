{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-1">Sign in</h4>
    <p class="text-muted small">Malkhana Management System. Authorised police staff only.</p>
    <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" autofocus required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
