{% extends "base.html" %}{% from "_macros.html" import table, select %}
{% block content %}
<h3>Cases (FIR)</h3>
<form method="post" class="card card-body mb-4">
  <div class="row g-2">
    <div class="col-md-3"><label class="form-label">Police station *</label>{{ select('station_id', stations) }}</div>
    <div class="col-md-2"><label class="form-label">FIR no *</label><input class="form-control" name="fir_no" placeholder="45/2026" required></div>
    <div class="col-md-2"><label class="form-label">FIR date *</label><input type="date" class="form-control" name="fir_date" required></div>
    <div class="col-md-3"><label class="form-label">Sections *</label><input class="form-control" name="sections" placeholder="BNS 303(2)" required></div>
    <div class="col-md-2"><label class="form-label">Status</label>
      <select class="form-select" name="status">{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Investigating officer *</label>{{ select('io_id', officers) }}</div>
    <div class="col-md-3"><label class="form-label">Court</label>{{ select('court_id', courts, False) }}</div>
    <div class="col-md-2"><label class="form-label">Court case no</label><input class="form-control" name="court_case_no"></div>
    <div class="col-md-2"><label class="form-label">Accused name</label><input class="form-control" name="accused"></div>
    <div class="col-md-2"><label class="form-label">Complainant name</label><input class="form-control" name="complainant"></div>
    <div class="col-12"><button class="btn btn-primary mt-2">Register case</button></div>
  </div>
</form>
{{ table(rows) }}
{% endblock %}
